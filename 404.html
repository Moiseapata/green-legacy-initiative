<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Green Legacy Initiative</title>
    <script type="text/javascript">
      // Redirige toutes les erreurs 404 vers la page d'accueil
      var segmentCount = 0;
      var path = window.location.pathname;
      if (path.startsWith('/green-legacy-initiative/')) {
        path = path.substring('/green-legacy-initiative/'.length);
      }
      var segments = path.split('/').filter(Boolean);
      if (segments.length > 0) {
        window.location.href = '/green-legacy-initiative/';
      }
    </script>
  </head>
  <body>
    <p>Redirection en cours...</p>
  </body>
</html>
